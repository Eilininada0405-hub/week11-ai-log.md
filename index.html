<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6">TODOリスト</h1>

        <div class="flex gap-2 mb-6">
            <input id="todoInput" type="text" placeholder="タスクを入力..."
                class="flex-1 border border-gray-300 rounded px-3 py-2">
            <button id="addBtn"
                class="bg-blue-600 text-white font-bold px-4 py-2 rounded hover:bg-blue-700 transition">
                追加
            </button>
        </div>

        <ul id="todoList" class="space-y-2"></ul>
    </div>

    <script>
        const addButton = document.querySelector("#addBtn");
        const todoInput = document.querySelector("#todoInput");
        const todoList = document.querySelector("#todoList");

        function addTodo() {
            const text = todoInput.value.trim();

            // 空白だけの入力は無効にする
            if (!text) {
                todoInput.focus();
                return;
            }

            const item = document.createElement("li");
            item.className = "flex items-center justify-between gap-3 bg-gray-50 rounded px-3 py-2";

            const span = document.createElement("span");
            span.textContent = text;
            span.className = "break-all";

            const doneBtn = document.createElement("button");
            doneBtn.type = "button";
            doneBtn.textContent = "完了";
            doneBtn.className = "text-sm text-gray-500 hover:text-red-500";

            doneBtn.addEventListener("click", () => {
                const isDone = span.classList.contains("line-through");
                const nextDone = !isDone;

                span.classList.toggle("line-through", nextDone);
                span.classList.toggle("text-gray-400", nextDone);
                doneBtn.textContent = nextDone ? "戻す" : "完了";
            });

            item.appendChild(span);
            item.appendChild(doneBtn);
            todoList.appendChild(item);

            todoInput.value = "";
            todoInput.focus();
        }

        addButton.addEventListener("click", addTodo);

        todoInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                addTodo();
            }
        });
    </script>

</body>
</html>
</body>
</html>
